name: Update Palabra del Día feed

on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC daily -- adjust to taste
  workflow_dispatch: {}     # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  build-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate rss.xml
        run: python3 generate_feed.py

      - name: Commit updated feed
        run: |
          git config user.name "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          git add rss.xml
          git diff --cached --quiet || git commit -m "Update feed $(date -u +%Y-%m-%d)"
          git push
